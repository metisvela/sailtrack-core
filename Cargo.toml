[package]
name = "sailtrack-core"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.11"
rumqttc = "0.24"
eskf = { git = "https://github.com/nordmoen/eskf-rs.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = { version = "=0.32.6", features = ["serde-serialize"] }